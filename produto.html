<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produto | PêlaModa</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<header>
    <div class="container nav">

        <a href="index.html" class="logo">
    <img
        src="imagens/logo.png"
        alt="Pêla Moda"
        class="logo-pelamoda"
        style="width:65px; height:65px; object-fit:contain;"
    >
</a>

        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#produtos">Produtos</a>
            <a href="index.html#sobre">Sobre</a>
            <a href="index.html#contato">Contato</a>
        </nav>
<button class="cart-header-btn" onclick="abrirCarrinho()" aria-label="Abrir carrinho">
    <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 8V6a5 5 0 0 1 10 0v2h3l-1 14H5L4 8h3Zm2 0h6V6a3 3 0 0 0-6 0v2Zm-2.85 2 .72 10h10.26l.72-10H17v2h-2v-2H9v2H7v-2h-.85Z"/>
    </svg>

    <span id="cartCount">0</span>
</button>
    </div>
</header>


<main>

<section class="product-page">
<div
       id="produtoAtual"
    data-nome=""
    data-preco=""

></div>
     <div class="container product-page-grid">

    <!-- GALERIA -->

    <div class="product-gallery">

        <div class="product-main-image">
            <img
                id="imagemPrincipal"
                alt="Produto PêlaModa"
            >
        </div>

        <div class="product-thumbnails">
        </div>

    </div> <!-- FECHA product-gallery -->


    <!-- INFORMAÇÕES -->

    <div class="product-details">

            <span class="product-category">
                PÊLAMODA
            </span>

            <h1></h1>

            <div class="product-price">

            </div>

            
            <!-- CORES -->

         <div class="product-option">

    <strong>Cor</strong>

    <div
        class="option-buttons"
        id="opcoesCores"
    >
    </div>

</div>


            <!-- TAMANHOS -->

            <div class="product-option">

    <strong>Tamanho</strong>

    <div
        class="option-buttons"
        id="opcoesTamanhos"
    >
    </div>

</div>

            <!-- QUANTIDADE -->

            <div class="product-option">

                <strong>Quantidade</strong>

                <div class="quantity">

                    <button onclick="alterarQuantidade(-1)">
                        −
                    </button>

                    <span id="quantidade">
                        1
                    </span>

                    <button onclick="alterarQuantidade(1)">
                        +
                    </button>

                </div>

            </div>


            <!-- BOTÕES -->

            <button
                class="product-cart-button"
                onclick="adicionarCarrinho()"
            >
                Adicionar ao carrinho
            </button>

            <button
                class="product-whatsapp-button"
                onclick="comprarProdutoWhatsApp()"
            >
                Comprar pelo WhatsApp
            </button>
            <p class="product-description">
                           </p>

            <p class="product-help">
                Precisa de ajuda com tamanho ou cor?
                Fale com a gente pelo WhatsApp.
            </p>

        </div>

    </div>

</section>

</main>

<!-- CARRINHO LATERAL -->

<div class="cart-overlay" id="cartOverlay" onclick="fecharCarrinho()"></div>

<aside class="cart-drawer" id="cartDrawer">

    <div class="cart-header">
        <h2>Seu carrinho</h2>

        <button onclick="fecharCarrinho()" aria-label="Fechar carrinho">
            ×
        </button>
    </div>

    <div class="cart-items" id="cartItems">
        <!-- Produtos entram aqui pelo JavaScript -->
    </div>

    <div class="cart-empty" id="cartEmpty">
        Seu carrinho está vazio.
    </div>

    <div class="cart-footer">

        <div class="cart-subtotal">
            <span>Subtotal</span>
            <strong id="cartSubtotal">R$ 0,00</strong>
        </div>

        <button class="cart-checkout" onclick="window.location.href='checkout.html'">
            Finalizar pedido
        </button>

        <button class="cart-continue" onclick="fecharCarrinho()">
            Continuar comprando
        </button>

    </div>

</aside>
<script src="JS/produtos.js"></script>
<script src="JS/script.js"></script>

</body>
</html>
