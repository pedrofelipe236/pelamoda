<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211f1d">
    <title>Acompanhar pedido | PêlaModa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Bebas+Neue&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pm-dark: #211f1d;
            --pm-ink: #2d2925;
            --pm-muted: #756d65;
            --pm-bg: #f5f1eb;
            --pm-card: #ffffff;
            --pm-line: #e8e0d7;
            --pm-accent: #b7864b;
            --pm-accent-dark: #8f6535;
            --pm-error: #a33d32;
            --pm-success: #28734b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px 16px;
            display: grid;
            place-items: center;
            background: var(--pm-bg);
            color: var(--pm-ink);
            font-family: Arial, Helvetica, sans-serif;
        }

        .page { width: 100%; max-width: 520px; }

        .brand {
            display: block;
            margin: 0 auto 22px;
            color: var(--pm-dark);
            text-align: center;
            text-decoration: none;
        }

        .brand strong {
            display: block;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 34px;
            letter-spacing: -1.2px;
        }

        .brand span {
            display: block;
            margin-top: 4px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .card {
            padding: 30px;
            border: 1px solid var(--pm-line);
            border-radius: 18px;
            background: var(--pm-card);
            box-shadow: 0 14px 38px rgba(40, 31, 22, .07);
        }

        h1 {
            margin: 0;
            color: var(--pm-dark);
            font-size: 25px;
            line-height: 1.2;
            text-align: center;
        }

        .intro {
            margin: 10px 0 25px;
            color: var(--pm-muted);
            font-size: 14px;
            line-height: 1.55;
            text-align: center;
        }

        .field { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--pm-ink);
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--pm-line);
            border-radius: 9px;
            outline: none;
            background: #fff;
            color: var(--pm-ink);
            font: inherit;
            font-size: 15px;
        }

        input:focus {
            border-color: var(--pm-accent);
            box-shadow: 0 0 0 3px rgba(183, 134, 75, .13);
        }

        .hint {
            display: block;
            margin-top: 6px;
            color: var(--pm-muted);
            font-size: 11px;
            line-height: 1.4;
        }

        button, .payment-link {
            display: flex;
            width: 100%;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 9px;
            background: var(--pm-dark);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .4px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover, .payment-link:hover { background: #39332e; }
        button:disabled { cursor: wait; opacity: .65; }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error { display: block; background: #fff1ef; color: var(--pm-error); }
        .message.info { display: block; background: #f5f1eb; color: var(--pm-muted); }

        .result {
            display: none;
            margin-top: 22px;
            padding: 18px;
            border: 1px solid var(--pm-line);
            border-radius: 12px;
            background: #fcfaf7;
        }

        .result h2 { margin: 0 0 14px; font-size: 16px; }
        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid var(--pm-line);
            font-size: 13px;
        }
        .result-row span { color: var(--pm-muted); }
        .result-row strong { text-align: right; overflow-wrap: anywhere; }

        .status {
            display: inline-block;
            padding: 6px 9px;
            border-radius: 99px;
            background: #f2e8d9;
            color: var(--pm-accent-dark);
            font-size: 12px;
            font-weight: 700;
        }

        .payment-link { margin-top: 15px; background: var(--pm-accent-dark); }
        .payment-link:hover { background: #76512b; }

        .back {
            display: block;
            margin-top: 20px;
            color: var(--pm-muted);
            font-size: 13px;
            text-align: center;
            text-decoration: none;
        }
        .back:hover { color: var(--pm-ink); }

        @media (max-width: 480px) {
            body { padding: 20px 13px; }
            .card { padding: 24px 19px; }
            h1 { font-size: 22px; }
        }
        /* IDENTIDADE VISUAL PÊLAMODA */
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 0;
    background: #f4e4cf;
    color: #32180f;
    font-family: "DM Sans", sans-serif;
}

.site-header {
    width: 100%;
    background: #42190f;
    box-shadow: 0 4px 18px rgba(50, 24, 15, .12);
}

.site-header-inner {
    width: calc(100% - 40px);
    max-width: 1180px;
    min-height: 82px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand {
    margin: 0;
    color: #fff6e9;
    text-align: left;
}

.brand strong {
    font-family: "Playfair Display", serif;
    font-size: 30px;
    letter-spacing: -1px;
}

.brand span {
    color: #f4e4cf;
    font-family: "DM Sans", sans-serif;
    letter-spacing: 1.5px;
}

.header-back {
    padding: 10px 16px;
    border: 1px solid rgba(255, 246, 233, .4);
    border-radius: 7px;
    color: #fff6e9;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    text-decoration: none;
    transition: .2s;
}

.header-back:hover {
    background: #c35d35;
    border-color: #c35d35;
}

.page {
    max-width: 560px;
    margin: 64px auto 30px;
}

.card {
    background: #fff6e9;
    border: 1px solid rgba(75, 29, 16, .18);
    border-radius: 14px;
    box-shadow: 0 14px 38px rgba(50, 24, 15, .09);
}

h1 {
    color: #42190f;
    font-family: "Bebas Neue", sans-serif;
    font-size: 36px;
    letter-spacing: .8px;
}

.intro {
    color: #735c4d;
    font-family: "DM Sans", sans-serif;
}

label {
    color: #32180f;
    font-family: "DM Sans", sans-serif;
}

input {
    border-color: rgba(75, 29, 16, .22);
    border-radius: 7px;
    background: #fffaf3;
    font-family: "DM Sans", sans-serif;
}

input:focus {
    border-color: #c35d35;
    box-shadow: 0 0 0 3px rgba(195, 93, 53, .12);
}

button, .payment-link {
    border-radius: 7px;
    background: #42190f;
    font-family: "DM Sans", sans-serif;
    transition: .2s;
}

button:hover {
    background: #c35d35;
}

.payment-link {
    background: #984326;
}

.payment-link:hover {
    background: #c35d35;
}

.status {
    background: #f4dfc9;
    color: #984326;
}

.back {
    color: #735c4d;
}

@media (max-width: 600px) {
    .site-header-inner {
        min-height: 72px;
        width: calc(100% - 28px);
    }

    .brand strong {
        font-size: 25px;
    }

    .header-back {
        padding: 9px 10px;
        font-size: 9px;
    }

    .page {
        margin: 36px auto 24px;
        width: calc(100% - 28px);
    }

    .card {
        padding: 24px 19px;
    }

    h1 {
        font-size: 30px;
    }
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="index.html" aria-label="PêlaModa - página inicial">
                <strong>PêlaModa</strong>
                <span>VESTIR O NORDESTE NO PEITO</span>
            </a>

            <a class="header-back" href="index.html">VOLTAR PARA A LOJA</a>
        </div>
    </header>

    <main class="page">

        <section class="card">
            <h1>ACOMPANHE SEU PEDIDO</h1>
            <p class="intro">Informe o código do pedido e o WhatsApp usado na compra para consultar a situação.</p>

            <form id="formConsulta" novalidate>
                <div class="field">
                    <label for="orderNsu">Código do pedido</label>
                    <input id="orderNsu" name="orderNsu" type="text" placeholder="Ex.: PELAMODA-1730000000000" autocomplete="off" required>
                </div>

                <div class="field">
                    <label for="telefone">WhatsApp usado na compra</label>
                    <input id="telefone" name="telefone" type="tel" inputmode="tel" placeholder="(81) 99999-9999" autocomplete="tel" required>
                    <small class="hint">Digite o mesmo número informado no checkout.</small>
                </div>

                <button id="btnConsultar" type="submit">CONSULTAR PEDIDO</button>
            </form>

            <div id="mensagem" class="message" role="status" aria-live="polite"></div>

            <section id="resultado" class="result" aria-live="polite">
                <h2>Detalhes do pedido</h2>
                <div class="result-row">
                    <span>Número do pedido</span>
                    <strong id="numeroPedido">—</strong>
                </div>
                <div class="result-row">
                    <span>Situação</span>
                    <strong><span id="statusPedido" class="status">—</span></strong>
                </div>
                <a id="linkPagamento" class="payment-link" href="#" target="_blank" rel="noopener" style="display:none">CONTINUAR PAGAMENTO</a>
            </section>
        </section>

        <a class="back" href="index.html">← Voltar para a loja</a>
    </main>

    <script>
        const formConsulta = document.getElementById("formConsulta");
        const campoPedido = document.getElementById("orderNsu");
        const campoTelefone = document.getElementById("telefone");
        const botaoConsultar = document.getElementById("btnConsultar");
        const mensagem = document.getElementById("mensagem");
        const resultado = document.getElementById("resultado");
        const numeroPedido = document.getElementById("numeroPedido");
        const statusPedido = document.getElementById("statusPedido");
        const linkPagamento = document.getElementById("linkPagamento");

        function mostrarMensagem(texto, tipo = "info") {
            mensagem.textContent = texto;
            mensagem.className = `message ${tipo}`;
        }

        function limparResultado() {
            resultado.style.display = "none";
            linkPagamento.style.display = "none";
            linkPagamento.removeAttribute("href");
        }

        function formatarStatus(status) {
            const nomes = {
                aguardando_pagamento: "Aguardando pagamento",
                pago: "Pagamento confirmado",
                cancelado: "Cancelado",
                expirado: "Expirado"
            };

            if (nomes[status]) return nomes[status];
            return String(status || "Em processamento").replaceAll("_", " ");
        }

        async function consultarPedido(orderNsu, telefone) {
            limparResultado();
            mensagem.className = "message";
            botaoConsultar.disabled = true;
            botaoConsultar.textContent = "CONSULTANDO...";

            try {
                const parametros = new URLSearchParams({
                    order_nsu: orderNsu.trim(),
                    telefone: telefone.replace(/\D/g, "")
                });

                const resposta = await fetch(`/api/buscar-pedido?${parametros.toString()}`);
                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.erro || "Não foi possível localizar o pedido.");
                }

                numeroPedido.textContent = dados.numero_pedido || orderNsu;
                statusPedido.textContent = formatarStatus(dados.status);
                resultado.style.display = "block";

                if (dados.pagamento_url && dados.status === "aguardando_pagamento") {
                    linkPagamento.href = dados.pagamento_url;
                    linkPagamento.style.display = "flex";
                }

                mensagem.className = "message";
            } catch (erro) {
                mostrarMensagem(erro.message || "Ocorreu um erro ao consultar o pedido.", "error");
            } finally {
                botaoConsultar.disabled = false;
                botaoConsultar.textContent = "CONSULTAR PEDIDO";
            }
        }

        formConsulta.addEventListener("submit", async event => {
            event.preventDefault();

            const orderNsu = campoPedido.value.trim();
            const telefone = campoTelefone.value.trim();

            if (!orderNsu || !telefone) {
                mostrarMensagem("Preencha o código do pedido e o WhatsApp usado na compra.", "error");
                return;
            }

            if (telefone.replace(/\D/g, "").length < 10) {
                mostrarMensagem("Confira o número do WhatsApp e tente novamente.", "error");
                return;
            }

            await consultarPedido(orderNsu, telefone);
        });

        // Preenche os dados do pedido mais recente salvo pelo checkout neste navegador.
        try {
            const historico = JSON.parse(localStorage.getItem("pelamodaPedidosConsulta") || "[]");
            const ultimoPedido = Array.isArray(historico) ? historico[0] : null;

            if (ultimoPedido?.order_nsu && ultimoPedido?.telefone) {
                campoPedido.value = ultimoPedido.order_nsu;
                campoTelefone.value = ultimoPedido.telefone;
                consultarPedido(ultimoPedido.order_nsu, ultimoPedido.telefone);
            }
        } catch (erro) {
            console.warn("Não foi possível recuperar o último pedido salvo neste navegador.", erro);
        }
    </script>
</body>
</html>
