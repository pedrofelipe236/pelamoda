                                type="text"

                        </div>
<div class="checkout-field">

</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    
const SUPABASE_URL =
    "https://vzvtsloymfzawmwgndiw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ezgD5HdaJe9jNrbjDXbqfg_UmXWR6Rr";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
        
    );
    async function preencherDadosUsuario() {
    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) return;

    const nome =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        "";

    const campoNome =
        document.getElementById("nome");

    const campoEmail =
        document.getElementById("email");

    if (campoNome && !campoNome.value) {
        campoNome.value = nome;
    }

    if (campoEmail && !campoEmail.value) {
        campoEmail.value = user.email || "";
    }
}

preencherDadosUsuario();
    // ========================================
    // VARIÁVEIS PRINCIPAIS
    // ========================================

    const carrinhoCheckout =
        JSON.parse(localStorage.getItem("pelamodaCarrinho")) || [];

    // Black November: T-shirts em pacotes e Croppeds por R$ 39,90.
    function blackNovemberCheckoutAtiva() {
        const inicio = Date.parse("2026-11-01T00:00:00-03:00");
        const fim = Date.parse("2026-11-27T23:59:59-03:00");
        return Date.now() >= inicio && Date.now() <= fim;
    }

    function checkoutEhCropped(item) {
        return String(item?.categoria || "").trim().toLowerCase() === "cropped";
    }

    function calcularDescontoBlackNovember(itens) {
        if (!blackNovemberCheckoutAtiva()) {
            return { quantidadeElegivel: 0, quantidadeCroppeds: 0, descontoCentavos: 0 };
        }

        const unidades = [];
        let quantidadeCroppeds = 0;

        (itens || []).forEach(item => {
            const quantidade = Math.max(0, Math.floor(Number(item.quantidade) || 0));
            if (checkoutEhCropped(item)) {
                quantidadeCroppeds += quantidade;
                return;
            }

            const precoCentavos = Math.max(0, Math.round(Number(item.preco) * 100));
            for (let i = 0; i < quantidade; i++) unidades.push(precoCentavos);
        });

        let descontoCentavos = 0;
        const quantidadeElegivel = unidades.length;
        const precosPacote = { 2: 9990, 3: 14490, 4: 18990 };

        for (let i = 0; i < unidades.length; i += 4) {
            const pacote = unidades.slice(i, i + 4);
            const precoPacote = precosPacote[pacote.length];
            if (!precoPacote) continue;

            const subtotalPacote = pacote.reduce((total, preco) => total + preco, 0);
            descontoCentavos += Math.max(0, subtotalPacote - precoPacote);
        }

        return { quantidadeElegivel, quantidadeCroppeds, descontoCentavos };
    }

    // Atualiza carrinhos antigos para o preço promocional dos Croppeds.
    if (blackNovemberCheckoutAtiva()) {
        let carrinhoFoiAtualizado = false;
        carrinhoCheckout.forEach(item => {
            if (!checkoutEhCropped(item)) return;
            const precoAtual = Number(item.preco) || 0;
            const precoBlackNovember = Math.min(precoAtual, 39.90);
            if (Math.abs(precoAtual - precoBlackNovember) > 0.001) {
                item.preco = precoBlackNovember;
                carrinhoFoiAtualizado = true;
            }
        });
        if (carrinhoFoiAtualizado) {
            localStorage.setItem("pelamodaCarrinho", JSON.stringify(carrinhoCheckout));
        }
    }

    let descontoBlackNovember = 0;
    let quantidadeTshirtsBlackNovember = 0;
    let blackNovemberAtivo = false;

    const checkoutItems =
        document.getElementById("checkout-items");

    const checkoutSubtotal =
        document.getElementById("checkout-subtotal");

    const checkoutTotal =
        document.getElementById("checkout-total");

    const checkoutFrete =
        document.getElementById("checkout-frete");

    const resultadoFrete =
        document.getElementById("resultado-frete");

    function formatarPreco(valor) {
        return `R$ ${Number(valor).toFixed(2).replace(".", ",")}`;
    }

    let valorFrete = 0;


    // ========================================
    // ENTREGA / RETIRADA / MOTO UBER
    // ========================================

    const tiposEntrega = document.querySelectorAll(
        'input[name="tipo-entrega"]'
    );

    const areaEndereco =
        document.getElementById("area-endereco");

    const areaRetirada =
        document.getElementById("area-retirada");

    tiposEntrega.forEach(opcao => {

        opcao.addEventListener("change", () => {

            const tipo = opcao.value;

            if (tipo === "retirada") {

                areaEndereco.style.display = "none";
                areaRetirada.style.display = "block";

                valorFrete = 0;
                checkoutFrete.textContent = "GRÁTIS";

                atualizarTotalCheckout();
            }

            if (tipo === "endereco") {

                areaEndereco.style.display = "block";
                areaRetirada.style.display = "none";

                checkoutFrete.textContent = "A calcular";
            }

            if (tipo === "motouber") {

                areaEndereco.style.display = "block";
                areaRetirada.style.display = "none";

                checkoutFrete.textContent = "A combinar";
                valorFrete = 0;

                atualizarTotalCheckout();
            }

        });

    });


    // ========================================
    // CEP
    // ========================================

    const cepInput =
        document.getElementById("cep");

    const ruaInput =
        document.getElementById("rua");

    const bairroInput =
        document.getElementById("bairro");

    const cidadeInput =
        document.getElementById("cidade");

    const estadoInput =
        document.getElementById("estado");

    cepInput.addEventListener("blur", async () => {

        const cep =
            cepInput.value.replace(/\D/g, "");

        if (cep.length !== 8) {
            return;
        }

        let dados;

        try {

            const resposta = await fetch(
                `https://viacep.com.br/ws/${cep}/json/`
            );

            dados = await resposta.json();

        } catch (erro) {

            console.error(
                "Erro ao consultar CEP:",
                erro
            );

            alert(
                "Não foi possível consultar o CEP."
            );

            return;
        }


        if (dados.erro) {

            alert("CEP não encontrado.");
            return;
        }


        ruaInput.value =
            dados.logradouro || "";

        bairroInput.value =
            dados.bairro || "";

        cidadeInput.value =
            dados.localidade || "";

        estadoInput.value =
            dados.uf || "";


        verificarEntregaGratis();

    });


    // ========================================
    // ENTREGA GRÁTIS
    // ========================================

    const bairrosGratis = {

        "paulista": [
            "janga",
            "pau amarelo"
        ],

        "olinda": [
            "rio doce",
            "casa caiada",
            "jardim atlantico",
            "bairro novo"
        ],

        "recife": [
            "espinheiro",
            "gracas",
            "boa vista",
            "santo amaro"
        ]

    };


    function normalizarTexto(texto) {

        return texto
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();

    }


    function verificarEntregaGratis() {
const tipoEntrega =
    document.querySelector(
        'input[name="tipo-entrega"]:checked'
    )?.value;

if (tipoEntrega === "motouber") {

    valorFrete = 0;

    checkoutFrete.textContent = "A combinar";

    resultadoFrete.innerHTML = `
        <div class="frete-normal">
            Valor da entrega por Moto Uber será combinado
            de acordo com o endereço.
        </div>
    `;

    atualizarTotalCheckout();

    return;
}
        const cidade =
            normalizarTexto(cidadeInput.value);

        const bairro =
            normalizarTexto(bairroInput.value);

        if (!cidade || !bairro) {

            resultadoFrete.innerHTML = "";
            return;
        }


        const bairrosDaCidade =
            bairrosGratis[cidade];


        if (
            bairrosDaCidade &&
            bairrosDaCidade.includes(bairro)
        ) {

            valorFrete = 0;

            checkoutFrete.textContent =
                "GRÁTIS";

            resultadoFrete.innerHTML = `
                <div class="frete-gratis">

                    ✓ ENTREGA GRÁTIS DISPONÍVEL

                    <strong>
                        R$ 0,00
                    </strong>

                    <span>
                        Prazo de entrega: até 2 dias úteis
                    </span>

                </div>
            `;

 } else {

    valorFrete = 0;

    checkoutFrete.textContent = "A calcular";

    calcularFreteSuperFrete();

}

        atualizarTotalCheckout();

    }
async function calcularFreteSuperFrete() {

    const cepDestino =
        cepInput.value.replace(/\D/g, "");

    if (cepDestino.length !== 8) {
        return;
    }

    resultadoFrete.innerHTML = `
        <div class="frete-normal">
            Calculando opções de entrega...
        </div>
    `;

    try {

        const resposta = await fetch("/api/frete", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                cepDestino: cepDestino
            })
        });

        const fretes = await resposta.json();

        if (!resposta.ok) {
            throw new Error(
                fretes.message ||
                fretes.erro ||
                "Erro ao calcular frete"
            );
        }

        const fretesValidos =
            fretes.filter(frete =>
                !frete.has_error &&
                frete.price
            );

        if (fretesValidos.length === 0) {

            resultadoFrete.innerHTML = `
                <div class="frete-normal">
                    Nenhuma opção de entrega encontrada
                    para este CEP.
                </div>
            `;

            return;
        }

        resultadoFrete.innerHTML = `
            <div class="opcoes-frete">

                <strong>
                    Escolha a forma de entrega:
                </strong>

                ${fretesValidos.map(frete => {

                    const preco =
                        Number(
                            String(frete.price)
                                .replace(",", ".")
                        );

                    const prazo =
                        frete.delivery_time;

                    return `
                        <label class="frete-opcao">

                            <input
                                type="radio"
                                name="frete-superfrete"
                                value="${preco}"
                                data-nome="${frete.name}"
                            >

                            <span>
                                <strong>
                                    ${frete.name}
                                </strong>

                                <small>
                                    R$ ${preco
                                        .toFixed(2)
                                        .replace(".", ",")}
                                    • ${prazo}
                                    ${prazo == 1 ? "dia útil" : "dias úteis"}
                                </small>
                            </span>

                        </label>
                    `;

                }).join("")}

            </div>
        `;


        const opcoesFrete =
            document.querySelectorAll(
                'input[name="frete-superfrete"]'
            );


        opcoesFrete.forEach(opcao => {

            opcao.addEventListener("change", () => {

                valorFrete =
                    Number(opcao.value);

                checkoutFrete.textContent =
                    `R$ ${valorFrete
                        .toFixed(2)
                        .replace(".", ",")}`;

                atualizarTotalCheckout();

            });

        });

    } catch (erro) {

        console.error(
            "Erro ao calcular frete:",
            erro
        );

        checkoutFrete.textContent =
            "Indisponível";

        resultadoFrete.innerHTML = `
            <div class="frete-normal">
                Não foi possível calcular
                o frete neste momento.
            </div>
        `;

    }

}

    // ========================================
    // RESUMO DO CARRINHO
    // ========================================

    function carregarResumoCheckout() {

        checkoutItems.innerHTML = "";

        let subtotal = 0;


        carrinhoCheckout.forEach(item => {

            const totalItem =
                item.preco * item.quantidade;

            subtotal += totalItem;


            checkoutItems.innerHTML += `
                <div class="checkout-item">

                    <img
                        src="${item.imagem}"
                        alt="${item.nome}"
                    >

                    <div class="checkout-item-info">

                        <strong>
                            ${item.nome}
                        </strong>

                        <span>
                            ${item.cor} • ${item.tamanho}
                        </span>

                        <span>
                            Quantidade: ${item.quantidade}
                        </span>

                    </div>

                    <strong>
                        R$ ${totalItem
                            .toFixed(2)
                            .replace(".", ",")}
                    </strong>

                </div>
            `;

        });


        checkoutSubtotal.textContent =
            `R$ ${subtotal.toFixed(2).replace(".", ",")}`;

        const promo = calcularDescontoBlackNovember(carrinhoCheckout);
        descontoBlackNovember = promo.descontoCentavos / 100;
        quantidadeTshirtsBlackNovember = promo.quantidadeElegivel;
        blackNovemberAtivo =
            descontoBlackNovember > 0 || promo.quantidadeCroppeds > 0;

        // Ao entrar no checkout, o desconto por quantidade já vem aplicado.
        if (!cupomAplicado) {
            valorDesconto = descontoBlackNovember;
        }

        const avisoBlackNovember =
            document.getElementById("blacknovember-checkout-aviso");
        const areaCupom = document.querySelector(".checkout-cupom");

        if (blackNovemberAtivo) {
            avisoBlackNovember.hidden = false;
            avisoBlackNovember.style.cssText =
                "margin:14px 0;padding:13px 15px;border:1px solid #f4c7ad;border-radius:10px;background:#fff7f1;color:#8f350e;font-size:13px;line-height:1.5;";
            const avisosPromocao = [];
            if (descontoBlackNovember > 0) {
                avisosPromocao.push(
                    `Você ganhou ${formatarPreco(descontoBlackNovember)} de desconto em ${quantidadeTshirtsBlackNovember} T-shirt(s).`
                );
            }
            if (promo.quantidadeCroppeds > 0) {
                avisosPromocao.push(
                    `${promo.quantidadeCroppeds} Cropped(s) por R$ 39,90 cada.`
                );
            }
            avisoBlackNovember.innerHTML =
                `<strong>BLACK NOVEMBER ATIVADA!</strong><br>` +
                `${avisosPromocao.join("<br>")} A oferta já está aplicada ao total.`;
            if (areaCupom) areaCupom.style.display = "none";
        } else {
            avisoBlackNovember.hidden = true;
            if (areaCupom) areaCupom.style.display = "";
        }

        atualizarTotalCheckout();

    }


    // ========================================
    // TOTAL
    // ========================================

    function atualizarTotalCheckout() {

        let subtotal = 0;

        carrinhoCheckout.forEach(item => {

            subtotal +=
                item.preco * item.quantidade;

        });


        const total = subtotal - valorDesconto + valorFrete;

        checkoutTotal.textContent =
            `R$ ${Math.max(0, total).toFixed(2).replace(".", ",")}`;

        if (valorDesconto > 0) {
            linhaDesconto.style.display = "flex";
            checkoutDesconto.textContent =
                `- R$ ${valorDesconto.toFixed(2).replace(".", ",")}`;
            document.getElementById("checkout-desconto-label").textContent =
                blackNovemberAtivo ? "Desconto Black November" : "Cupom de desconto";
        } else {
            linhaDesconto.style.display = "none";
        }
    }

    // O desconto automático substitui cupons durante a campanha.
    let cupomAplicado = "";
    let valorDesconto = 0;

const inputCupom =
    document.getElementById("cupom");

const botaoAplicarCupom =
    document.getElementById("btn-aplicar-cupom");

const mensagemCupom =
    document.getElementById("cupom-mensagem");

const linhaDesconto =
    document.getElementById("linha-desconto");

const checkoutDesconto =
    document.getElementById("checkout-desconto");

    botaoAplicarCupom?.addEventListener(
    "click",
    async () => {
if (blackNovemberAtivo) {
    mensagemCupom.textContent =
        "A oferta Black November não acumula com outros cupons.";
    mensagemCupom.style.color = "#b42318";
    return;
}

if (cupomAplicado) {

    cupomAplicado = "";
    valorDesconto = 0;

    inputCupom.value = "";
    inputCupom.disabled = false;

    linhaDesconto.style.display = "none";

    checkoutDesconto.textContent =
        "- R$ 0,00";

    mensagemCupom.textContent =
        "Cupom removido.";
        mensagemCupom.style.color = "#666";

    botaoAplicarCupom.textContent =
        "APLICAR";

    atualizarTotalCheckout();

    return;
}
        const codigo =
            inputCupom.value
                .trim()
                .toUpperCase();

        if (!codigo) {
            mensagemCupom.textContent =
                "Digite um cupom.";
                mensagemCupom.style.color = "#b42318";
            return;
        }

        try {

    async function completarCategoriasDoCarrinho() {
        try {
            const resposta = await fetch("/api/produtos");
            if (!resposta.ok) throw new Error("Não foi possível consultar as categorias.");

            const catalogo = await resposta.json();
            const porId = new Map(catalogo.map(produto => [String(produto.id), produto]));
            let carrinhoFoiAtualizado = false;

            carrinhoCheckout.forEach(item => {
                const produto = porId.get(String(item.produtoId));
                if (!produto) return;

                if (produto.categoria && item.categoria !== produto.categoria) {
                    item.categoria = produto.categoria;
                    carrinhoFoiAtualizado = true;
                }

                const precoNormal = Number(produto.preco) / 100;
                const precoPromocional = produto.preco_promocional
                    ? Number(produto.preco_promocional) / 100
                    : 0;
                const precoBase = precoPromocional > 0 && precoPromocional < precoNormal
                    ? precoPromocional
                    : precoNormal;
                const precoAtual = blackNovemberCheckoutAtiva() && checkoutEhCropped(produto)
                    ? Math.min(precoBase, 39.90)
                    : precoBase;

                if (Math.abs(Number(item.preco) - precoAtual) > 0.001) {
                    item.preco = precoAtual;
                    carrinhoFoiAtualizado = true;
                }
            });

            if (carrinhoFoiAtualizado) {
                localStorage.setItem("pelamodaCarrinho", JSON.stringify(carrinhoCheckout));
            }
        } catch (erro) {
            console.error("Erro ao carregar categorias do carrinho:", erro);
            // Mantém a categoria que já estiver salva no carrinho.
        }
    }

    (async () => {
        await completarCategoriasDoCarrinho();
        carregarResumoCheckout();
        atualizarTotalCheckout();
    })();
