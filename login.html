<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | PêlaModa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f5f0e8;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #111;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 32px;
            border: 1px solid rgba(0,0,0,.08);
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.05);
            text-align: center;
        }

        .login-box h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .login-box p {
            margin: 0 0 26px;
            font-size: 14px;
            color: #665f58;
        }

        .btn-google {
            width: 100%;
            height: 48px;
            border: 1px solid #d8d2ca;
            border-radius: 8px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-google:hover {
            background: #faf8f5;
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .voltar {
            display: inline-block;
            margin-top: 22px;
            font-size: 13px;
            color: #111;
            text-decoration: none;
        }

        #mensagem {
            margin-top: 16px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Entrar</h1>

        <p>
            Entre na sua conta PêlaModa.
        </p>

        <button class="btn-google" id="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
            Continuar com Google
        </button>

        <div id="mensagem"></div>

        <a href="index.html" class="voltar">
            ← Voltar para a loja
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://vzvtsloymfzawmwgndiw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_ezgD5HdaJe9jNrbjDXbqfg_UmXWR6Rr";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        document
            .getElementById("btn-google")
            .addEventListener("click", async () => {

                const mensagem =
                    document.getElementById("mensagem");

                mensagem.textContent =
                    "Abrindo login do Google...";

                const { error } =
                    await supabaseClient.auth.signInWithOAuth({
                        provider: "google",
                        options: {
                            redirectTo:
                                `${window.location.origin}/login.html`
                        }
                    });

                if (error) {
                    console.error(error);

                    mensagem.textContent =
                        "Não foi possível entrar com Google.";
                }

            });

    </script>

</body>
</html>
