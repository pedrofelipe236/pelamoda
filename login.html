<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Conta | PêlaModa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background: #f5f0e8;

            font-family: "Segoe UI", Arial, sans-serif;
            color: #111;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #fff;

            padding: 32px;

            border: 1px solid rgba(0, 0, 0, .08);
            border-radius: 14px;

            box-shadow: 0 4px 18px rgba(0, 0, 0, .05);

            text-align: center;
        }

        .login-box h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .login-box p {
            margin: 0 0 26px;
            font-size: 14px;
            color: #665f58;
        }

        .btn-google {
            width: 100%;
            height: 48px;

            border: 1px solid #d8d2ca;
            border-radius: 8px;

            background: #fff;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        .btn-google:hover {
            background: #faf8f5;
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .voltar {
            display: inline-block;

            margin-top: 22px;

            font-size: 13px;

            color: #111;
            text-decoration: none;
        }

        #mensagem {
            margin-top: 16px;
            font-size: 13px;
        }

        #meus-pedidos {
            margin-top: 28px;
            text-align: left;
        }

        #meus-pedidos h2 {
            margin: 0 0 15px;
            font-size: 15px;
        }

        .pedido-card {
            padding: 16px;
            margin-bottom: 10px;

            border: 1px solid #ddd6cd;
            border-radius: 9px;

            background: #faf8f5;
        }

        .pedido-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .pedido-topo strong {
            font-size: 13px;
        }

        .pedido-valor {
            white-space: nowrap;
        }

        .pedido-status {
            margin-top: 7px;

            font-size: 12px;
            color: #665f58;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Entrar</h1>

        <p>
            Entre na sua conta PêlaModa.
        </p>

        <button
            class="btn-google"
            id="btn-google"
        >
            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt=""
            >

            Continuar com Google
        </button>

        <div id="mensagem"></div>

        <a
            href="index.html"
            class="voltar"
        >
            ← Voltar para a loja
        </a>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://vzvtsloymfzawmwgndiw.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_ezgD5HdaJe9jNrbjDXbqfg_UmXWR6Rr";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        function formatarStatus(status) {

            const statusFormatados = {
                aguardando_pagamento:
                    "Aguardando pagamento",

                pago:
                    "Pagamento confirmado",

                cancelado:
                    "Cancelado",

                expirado:
                    "Expirado"
            };


            return (
                statusFormatados[status] ||
                String(status || "")
                    .replaceAll("_", " ")
            );
        }



        async function carregarMeusPedidos(
            accessToken
        ) {

            const lista =
                document.getElementById(
                    "lista-meus-pedidos"
                );


            if (!lista) {
                return;
            }


            try {

                const resposta =
                    await fetch(
                        "/api/buscar-pedido?modo=meus-pedidos",
                        {
                            headers: {
                                Authorization:
                                    `Bearer ${accessToken}`
                            }
                        }
                    );


                const dados =
                    await resposta.json();


                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        "Erro ao buscar pedidos"
                    );
                }


                if (!dados.pedidos?.length) {

                    lista.innerHTML = `
                        <p style="
                            font-size:13px;
                            color:#665f58;
                            margin:0;
                        ">
                            Você ainda não possui pedidos.
                        </p>
                    `;

                    return;
                }


                lista.innerHTML =
                    dados.pedidos
                        .map(pedido => {

                            const valor =
                                (
                                    Number(
                                        pedido.valor_total ||
                                        0
                                    ) / 100
                                )
                                .toLocaleString(
                                    "pt-BR",
                                    {
                                        style:
                                            "currency",

                                        currency:
                                            "BRL"
                                    }
                                );


                            return `
                                <div class="pedido-card">

                                    <div class="pedido-topo">

                                        <strong>
                                            Pedido #${pedido.numero_pedido}
                                        </strong>

                                        <strong class="pedido-valor">
                                            ${valor}
                                        </strong>

                                    </div>


                                    <div class="pedido-status">
                                        ${formatarStatus(
                                            pedido.status
                                        )}
                                    </div>

                                </div>
                            `;

                        })
                        .join("");


            } catch (erro) {

                console.error(
                    "Erro ao carregar pedidos:",
                    erro
                );


                lista.innerHTML = `
                    <p style="
                        font-size:13px;
                        margin:0;
                    ">
                        Não foi possível carregar seus pedidos.
                    </p>
                `;
            }
        }



        async function verificarUsuario() {

            const {
                data: { user }
            } =
                await supabaseClient.auth.getUser();


            if (!user) {
                return;
            }


            const nome =
                user.user_metadata?.full_name ||
                user.user_metadata?.name ||
                "Cliente";


            const foto =
                user.user_metadata?.avatar_url ||
                "";


            document
                .querySelector(".login-box")
                .innerHTML = `

                    ${
                        foto
                            ? `
                                <img
                                    src="${foto}"
                                    alt=""
                                    style="
                                        width:80px;
                                        height:80px;
                                        border-radius:50%;
                                        object-fit:cover;
                                        margin-bottom:15px;
                                    "
                                >
                            `
                            : ""
                    }


                    <h1>
                        Olá, ${nome}!
                    </h1>


                    <p>
                        ${user.email}
                    </p>


                    <button
                        id="btn-sair"
                        class="btn-google"
                    >
                        Sair da conta
                    </button>


                    <div id="meus-pedidos">

                        <h2>
                            MEUS PEDIDOS
                        </h2>


                        <div id="lista-meus-pedidos">
                            Carregando pedidos...
                        </div>

                    </div>


                    <a
                        href="index.html"
                        class="voltar"
                    >
                        ← Voltar para a loja
                    </a>
                `;


            document
                .getElementById("btn-sair")
                .addEventListener(
                    "click",
                    async () => {

                        await supabaseClient
                            .auth
                            .signOut();


                        window.location.href =
                            "login.html";
                    }
                );


            const {
                data: { session }
            } =
                await supabaseClient.auth
                    .getSession();


            if (session?.access_token) {

                await carregarMeusPedidos(
                    session.access_token
                );
            }
        }



        document
            .getElementById("btn-google")
            .addEventListener(
                "click",
                async () => {

                    const mensagem =
                        document.getElementById(
                            "mensagem"
                        );


                    mensagem.textContent =
                        "Abrindo login do Google...";


                    const { error } =
                        await supabaseClient.auth
                            .signInWithOAuth({
                                provider: "google",

                                options: {
                                    redirectTo:
                                        `${window.location.origin}/login.html`
                                }
                            });


                    if (error) {

                        console.error(error);


                        mensagem.textContent =
                            "Não foi possível entrar com Google.";
                    }
                }
            );


        verificarUsuario();

    </script>

</body>

</html>
