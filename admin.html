<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | PêlaModa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3e7d3;
            color: #111;
        }

        .admin {
            width: min(1100px, calc(100% - 30px));
            margin: 40px auto;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 5px;
        }

        .produto-admin {
            background: #fff;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .produto-admin h2 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .produto-preco {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .cor-admin {
            margin-top: 20px;
        }

        .cor-admin h3 {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .estoque-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .estoque-item {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            background: #fafafa;
        }

        .estoque-item strong {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .estoque-item span {
            font-size: 20px;
            font-weight: bold;
        }

        .sem-estoque {
            opacity: .45;
        }

        .erro {
            background: #ffdede;
            padding: 15px;
            border-radius: 6px;
        }
        .estoque-controle {
    display: flex;
    align-items: center;
    gap: 6px;
}

.estoque-controle button {
    width: 32px;
    height: 32px;
    border: 0;
    background: #111;
    color: #fff;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
}

.estoque-input {
    width: 55px;
    height: 32px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
}

.salvar-estoque {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: 0;
    border-radius: 7px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.salvar-estoque:disabled {
    opacity: .5;
    cursor: wait;
}

.mensagem-admin {
    margin-top: 15px;
    padding: 12px;
    border-radius: 6px;
    display: none;
}

.mensagem-admin.sucesso {
    display: block;
    background: #dff5e3;
}

.mensagem-admin.erro {
    display: block;
    background: #ffdede;
}
.novo-produto {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 40px;
}

.novo-produto h1 {
    margin-top: 0;
    margin-bottom: 5px;
}

.form-produto {
    display: grid;
    gap: 15px;
    margin-top: 25px;
}

.form-produto label {
    display: grid;
    gap: 6px;
    font-weight: bold;
}

.form-produto input,
.form-produto select,
.form-produto textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font: inherit;
}

.form-produto textarea {
    resize: vertical;
}

.cadastrar-produto {
    padding: 14px;
    border: 0;
    border-radius: 7px;
    background: #111;
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.cadastrar-produto:disabled {
    opacity: .5;
    cursor: wait;
}
.cores-novo-produto {
    margin-top: 10px;
}

.nova-cor {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-top: 12px;
    background: #fafafa;
}

.nova-cor-topo {
    display: flex;
    gap: 10px;
    align-items: center;
}

.nova-cor-topo input {
    flex: 1;
}

.remover-cor {
    border: 0;
    background: #eee;
    border-radius: 5px;
    padding: 10px 12px;
    cursor: pointer;
}

.tamanhos-nova-cor {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 15px;
}

.tamanho-novo-produto {
    display: grid;
    gap: 5px;
    text-align: center;
    font-size: 12px;
}

.tamanho-novo-produto input {
    text-align: center;
}

.adicionar-cor {
    margin-top: 12px;
    border: 1px solid #111;
    background: transparent;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
}

@media (max-width: 600px) {
    .tamanhos-nova-cor {
        grid-template-columns: repeat(3, 1fr);
    }
}
    </style>
</head>

<body>

    <main class="admin">
<section class="novo-produto">

    <h1>Novo produto</h1>
    <p>Cadastre um novo produto na PêlaModa.</p>

    <div class="form-produto">

        <label>
            Nome
            <input
                type="text"
                id="novoProdutoNome"
                placeholder="Ex: Cuscuz Arretado"
            >
        </label>

        <label>
            Preço
            <input
                type="number"
                id="novoProdutoPreco"
                placeholder="65,00"
                min="0"
                step="0.01"
            >
        </label>

        <label>
            Categoria
            <select id="novoProdutoCategoria">
                <option value="tshirt">T-shirt</option>
                <option value="cropped">Cropped</option>
            </select>
        </label>

        <label>
            Descrição
            <textarea
                id="novoProdutoDescricao"
                rows="4"
                placeholder="Descrição do produto..."
            ></textarea>
        </label>

        <button
            type="button"
            class="cadastrar-produto"
            id="btnCadastrarProduto"
            onclick="cadastrarProduto()"
        >
            Cadastrar produto
            <div class="cores-novo-produto">

    <strong>Cores e estoque</strong>

    <div id="novasCores"></div>

    <button
        type="button"
        class="adicionar-cor"
        onclick="adicionarCorProduto()"
    >
        + Adicionar cor
    </button>

</div>
        </button>

        <div
            id="mensagemProduto"
            class="mensagem-admin"
        ></div>

    </div>

</section>
        <div class="admin-header">
            <h1>Estoque PêlaModa</h1>
            <p>Produtos, cores, tamanhos e quantidades.</p>
        </div>

        <div id="listaEstoque">
            Carregando estoque...
        </div>
<button
    id="btnSalvarEstoque"
    class="salvar-estoque"
    onclick="salvarEstoque()"
>
    Salvar estoque
</button>

<div
    id="mensagemAdmin"
    class="mensagem-admin"
></div>
    </main>


    <script>

        async function carregarEstoque() {

            const lista = document.getElementById("listaEstoque");

            try {

                const resposta = await fetch("/api/produtos");

                const produtos = await resposta.json();

                if (!resposta.ok) {
                    throw new Error("Erro ao carregar produtos");
                }

                lista.innerHTML = "";


                produtos.forEach(produto => {

                    const produtoDiv =
                        document.createElement("div");

                    produtoDiv.className =
                        "produto-admin";


                    const preco =
                        Number(produto.preco) / 100;


                    produtoDiv.innerHTML = `
                        <h2>${produto.nome}</h2>

                        <div class="produto-preco">
                            R$ ${preco.toFixed(2).replace(".", ",")}
                        </div>

                        <div class="cores-container"></div>
                    `;


                    const coresContainer =
                        produtoDiv.querySelector(
                            ".cores-container"
                        );


                    const estoque =
                        produto.estoque || {};


                    Object.entries(estoque)
                        .forEach(([cor, tamanhos]) => {

                            const corDiv =
                                document.createElement("div");

                            corDiv.className =
                                "cor-admin";


                            corDiv.innerHTML = `
                                <h3>${cor}</h3>

                                <div class="estoque-grid"></div>
                            `;


                            const estoqueGrid =
                                corDiv.querySelector(
                                    ".estoque-grid"
                                );


                            Object.entries(tamanhos)
                                .forEach(
                                    ([tamanho, quantidade]) => {

                                        const item =
                                            document.createElement("div");

                                        item.className =
                                            "estoque-item";


                                        if (
                                            Number(quantidade) === 0
                                        ) {
                                            item.classList.add(
                                                "sem-estoque"
                                            );
                                        }


                                        item.innerHTML = `
    <strong>${tamanho}</strong>

    <div class="estoque-controle">

        <button
            type="button"
            class="diminuir-estoque"
        >
            −
        </button>

        <input
            type="number"
            min="0"
            class="estoque-input"
            value="${quantidade}"
            data-produto="${produto.id}"
            data-cor="${cor}"
            data-tamanho="${tamanho}"
        >

        <button
            type="button"
            class="aumentar-estoque"
        >
            +
        </button>

    </div>
`;

const input =
    item.querySelector(".estoque-input");

item
    .querySelector(".diminuir-estoque")
    .addEventListener("click", () => {

        const atual =
            Number(input.value) || 0;

        input.value =
            Math.max(0, atual - 1);

    });

item
    .querySelector(".aumentar-estoque")
    .addEventListener("click", () => {

        const atual =
            Number(input.value) || 0;

        input.value =
            atual + 1;

    });

                                        estoqueGrid.appendChild(
                                            item
                                        );

                                    }
                                );


                            coresContainer.appendChild(
                                corDiv
                            );

                        });


                    lista.appendChild(produtoDiv);

                });


                if (produtos.length === 0) {

                    lista.innerHTML =
                        "Nenhum produto cadastrado.";

                }

            }

            catch (erro) {

                console.error(erro);

                lista.innerHTML = `
                    <div class="erro">
                        Não foi possível carregar o estoque.
                    </div>
                `;

            }

        }

async function salvarEstoque() {

    let senha =
        sessionStorage.getItem("adminPassword");

    if (!senha) {

        senha = prompt(
            "Digite a senha do administrador:"
        );

        if (!senha) {
            return;
        }

    }


    const botao =
        document.getElementById(
            "btnSalvarEstoque"
        );

    const mensagem =
        document.getElementById(
            "mensagemAdmin"
        );


    botao.disabled = true;
    botao.textContent =
        "Salvando...";

    mensagem.className =
        "mensagem-admin";


    try {

        const campos =
            document.querySelectorAll(
                ".estoque-input"
            );


        for (const campo of campos) {

            const quantidade =
                Number(campo.value);


            if (
                !Number.isInteger(quantidade) ||
                quantidade < 0
            ) {
                throw new Error(
                    "Existe uma quantidade inválida."
                );
            }


            const resposta =
                await fetch(
                    "/api/atualizar-estoque",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "x-admin-password":
                                senha

                        },

                        body:
                            JSON.stringify({

                                produto_id:
                                    campo.dataset.produto,

                                cor:
                                    campo.dataset.cor,

                                tamanho:
                                    campo.dataset.tamanho,

                                quantidade:
                                    quantidade

                            })

                    }
                );


            if (resposta.status === 401) {

                sessionStorage.removeItem(
                    "adminPassword"
                );

                throw new Error(
                    "Senha incorreta."
                );

            }


            if (!resposta.ok) {

                const dados =
                    await resposta.json();

                throw new Error(
                    dados.erro ||
                    "Erro ao atualizar estoque."
                );

            }

        }


        sessionStorage.setItem(
            "adminPassword",
            senha
        );


        mensagem.textContent =
            "Estoque atualizado com sucesso.";

        mensagem.className =
            "mensagem-admin sucesso";


    }

    catch (erro) {

        console.error(erro);

        mensagem.textContent =
            erro.message;

        mensagem.className =
            "mensagem-admin erro";

    }

    finally {

        botao.disabled = false;

        botao.textContent =
            "Salvar estoque";

    }

}
async function cadastrarProduto() {

    const nome =
        document.getElementById("novoProdutoNome").value.trim();

    const preco =
        document.getElementById("novoProdutoPreco").value;

    const categoria =
        document.getElementById("novoProdutoCategoria").value;

    const descricao =
        document.getElementById("novoProdutoDescricao").value.trim();

    const mensagem =
        document.getElementById("mensagemProduto");

    const botao =
        document.getElementById("btnCadastrarProduto");


    if (!nome || !preco) {

        mensagem.textContent =
            "Preencha o nome e o preço.";

        mensagem.className =
            "mensagem-admin erro";

        return;
    }


    let senha =
        sessionStorage.getItem("adminPassword");


    if (!senha) {

        senha = prompt(
            "Digite a senha do administrador:"
        );

        if (!senha) {
            return;
        }

    }


    botao.disabled = true;
    botao.textContent = "Cadastrando...";

    mensagem.className =
        "mensagem-admin";


    try {

        const resposta =
            await fetch("/api/criar-produto", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "x-admin-password": senha
                },

                body: JSON.stringify({
                    nome,
                    preco,
                    categoria,
                    descricao
                })

            });


        const dados =
            await resposta.json();


        if (resposta.status === 401) {

            sessionStorage.removeItem(
                "adminPassword"
            );

            throw new Error(
                "Senha incorreta."
            );

        }


        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                "Erro ao cadastrar produto."
            );

        }


        sessionStorage.setItem(
            "adminPassword",
            senha
        );


        mensagem.textContent =
            `Produto "${dados.produto.nome}" cadastrado com sucesso.`;

        mensagem.className =
            "mensagem-admin sucesso";


        document.getElementById(
            "novoProdutoNome"
        ).value = "";

        document.getElementById(
            "novoProdutoPreco"
        ).value = "";

        document.getElementById(
            "novoProdutoDescricao"
        ).value = "";


        await carregarEstoque();

    }

    catch (erro) {

        console.error(erro);

        mensagem.textContent =
            erro.message;

        mensagem.className =
            "mensagem-admin erro";

    }

    finally {

        botao.disabled = false;

        botao.textContent =
            "Cadastrar produto";

    }

}
function adicionarCorProduto() {

    const container =
        document.getElementById("novasCores");

    const cor =
        document.createElement("div");

    cor.className = "nova-cor";

    cor.innerHTML = `
        <div class="nova-cor-topo">

            <input
                type="text"
                class="nome-nova-cor"
                placeholder="Nome da cor. Ex: Preta"
            >

            <button
                type="button"
                class="remover-cor"
                onclick="this.closest('.nova-cor').remove()"
            >
                Remover
            </button>

        </div>

        <div class="tamanhos-nova-cor">

            ${["PP", "P", "M", "G", "GG"].map(tamanho => `

                <label class="tamanho-novo-produto">

                    <strong>${tamanho}</strong>

                    <input
                        type="number"
                        class="estoque-novo-produto"
                        data-tamanho="${tamanho}"
                        value="0"
                        min="0"
                        step="1"
                    >

                </label>

            `).join("")}

        </div>
    `;

    container.appendChild(cor);
}
        document.addEventListener(
            "DOMContentLoaded",
            adicionarCorProduto();
            carregarEstoque
        );

    </script>

</body>

</html>
