<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | PêlaModa</title>

    <style>
        * {
            box-sizing: border-box;
        }
body {
    margin: 0;
    font-family: "Segoe UI", Inter, Arial, sans-serif;
    background: #f3e7d3;
    color: #111;
}

button,
input,
select,
textarea {
    font-family: inherit;
}
    

        .admin {
            width: min(1100px, calc(100% - 30px));
            margin: 40px auto;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 5px;
        }

        .produto-admin {
            background: #fff;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .produto-admin h2 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .produto-preco {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .cor-admin {
            margin-top: 20px;
        }

        .cor-admin h3 {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .estoque-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .estoque-item {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            background: #fafafa;
        }

        .estoque-item strong {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .estoque-item span {
            font-size: 20px;
            font-weight: bold;
        }

        .sem-estoque {
            opacity: .45;
        }

        .erro {
            background: #ffdede;
            padding: 15px;
            border-radius: 6px;
        }
        .estoque-controle {
    display: flex;
    align-items: center;
    gap: 6px;
}

.estoque-controle button {
    width: 32px;
    height: 32px;
    border: 0;
    background: #111;
    color: #fff;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
}

.estoque-input {
    width: 55px;
    height: 32px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
}

.salvar-estoque {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: 0;
    border-radius: 7px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.salvar-estoque:disabled {
    opacity: .5;
    cursor: wait;
}

.mensagem-admin {
    margin-top: 15px;
    padding: 12px;
    border-radius: 6px;
    display: none;
}

.mensagem-admin.sucesso {
    display: block;
    background: #dff5e3;
}

.mensagem-admin.erro {
    display: block;
    background: #ffdede;
}
.novo-produto {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 40px;
}

.novo-produto h1 {
    margin-top: 0;
    margin-bottom: 5px;
}

.form-produto {
    display: grid;
    gap: 15px;
    margin-top: 25px;
}

.form-produto label {
    display: grid;
    gap: 6px;
    font-weight: bold;
}

.form-produto input,
.form-produto select,
.form-produto textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font: inherit;
}

.form-produto textarea {
    resize: vertical;
}

.cadastrar-produto {
    padding: 14px;
    border: 0;
    border-radius: 7px;
    background: #111;
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.cadastrar-produto:disabled {
    opacity: .5;
    cursor: wait;
}
.cores-novo-produto {
    margin-top: 10px;
}

.nova-cor {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-top: 12px;
    background: #fafafa;
}

.nova-cor-topo {
    display: flex;
    gap: 10px;
    align-items: center;
}

.nova-cor-topo input {
    flex: 1;
}

.remover-cor {
    border: 0;
    background: #eee;
    border-radius: 5px;
    padding: 10px 12px;
    cursor: pointer;
}

.tamanhos-nova-cor {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 15px;
}

.tamanho-novo-produto {
    display: grid;
    gap: 5px;
    text-align: center;
    font-size: 12px;
}

.tamanho-novo-produto input {
    text-align: center;
}

.adicionar-cor {
    margin-top: 12px;
    border: 1px solid #111;
    background: transparent;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
}
.foto-nova-cor {
    flex: 1;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
}
.fotos-extras-produto {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

.fotos-extras-produto > strong {
    display: block;
    margin-bottom: 5px;
}

.ajuda-admin {
    margin: 0 0 12px;
    font-size: 13px;
    color: #666;
}

#fotosExtrasProduto {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
}
.editar-produto {
    margin-top: 12px;
    border: 1px solid #111;
    background: #fff;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.editar-produto:hover {
    background: #111;
    color: #fff;
}
#previewFotosExtras {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 15px;
}

.foto-extra-atual {
    width: 100px;
    display: grid;
    gap: 6px;
}

.foto-extra-atual img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 7px;
    border: 1px solid #ddd;
}

.remover-foto-extra {
    border: 0;
    border-radius: 5px;
    padding: 7px;
    cursor: pointer;
    background: #eee;
}

.remover-foto-extra:hover {
    background: #ddd;
}

@media (max-width: 700px) {
    .nova-cor-topo {
        flex-direction: column;
        align-items: stretch;
    }
}
.foto-atual-cor {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #ddd;
}
.acoes-produto-admin {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.alterar-status-produto {
    border: 1px solid #111;
    background: #eee;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.alterar-status-produto:hover {
    background: #ddd;
}


@media (max-width: 600px) {
    .tamanhos-nova-cor {
        grid-template-columns: repeat(3, 1fr);
    }
}
    </style>
</head>

<body>

    <main class="admin">
<section class="novo-produto">

    <h1>Novo produto</h1>

    <div class="form-produto">

 <!-- CORES E ESTOQUE -->

</section>
        <div class="admin-header">
            <h1>Estoque PêlaModa</h1>
            <p>Produtos, cores, tamanhos e quantidades.</p>
        </div>

        <div id="listaEstoque">
            Carregando estoque...
        </div>
<button
    id="btnSalvarEstoque"

>

    <script>

        async function alterarStatusProduto(
    produtoId,
    statusAtual
) {

    const senha =
        sessionStorage.getItem(
            "senhaAdmin"
        ) ||
        prompt(
            "Digite a senha do administrador:"
        );

    if (!senha) return;


    const novoStatus =
        !statusAtual;


    const confirmar =
        confirm(
            novoStatus
                ? "Deseja ativar este produto?"
                : "Deseja desativar este produto?"
        );

    if (!confirmar) return;


    try {

        const resposta =
            await fetch(
                "/api/editar-produto",
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "x-admin-password":
                            senha
                    },

                    body: JSON.stringify({
                        acao:
                            "alterar-status",

                        id:
                            produtoId,

                        ativo:
                            novoStatus
                    })
                }
            );


        const dados =
            await resposta.json();


        if (!resposta.ok) {
            throw new Error(
                dados.erro ||
                "Erro ao alterar status."
            );
        }


        sessionStorage.setItem(
            "senhaAdmin",
            senha
        );


        alert(
            novoStatus
                ? "Produto ativado."
                : "Produto desativado."
        );


        await carregarEstoque();


    } catch (erro) {

        alert(
            erro.message
        );

    }
}
let produtoEditando = null;
let dadosProdutoEditando = null;
async function editarProduto(produtoId) {

    try {

        const resposta =
            await fetch("/api/produtos");

        const produtos =
            await resposta.json();

        const produto =
            produtos.find(p => p.id === produtoId);

        if (!produto) {
            throw new Error("Produto não encontrado.");
        }

        produtoEditando = produto.id;
        dadosProdutoEditando = produto;

        // Cabeçalho
        document.getElementById("novoProdutoNome").value =
            produto.nome;

        document.getElementById("novoProdutoPreco").value =
            (produto.preco / 100).toFixed(2);

        document.getElementById("novoProdutoCategoria").value =
            produto.categoria;

        document.getElementById("novoProdutoDescricao").value =
            produto.descricao || "";

        // Limpa cores existentes
        const container =
            document.getElementById("novasCores");

        container.innerHTML = "";

        // Cria uma cor para cada existente
        produto.cores.forEach(cor => {

            adicionarCorProduto();

            const bloco =
                container.lastElementChild;

            bloco.querySelector(".nome-nova-cor").value =
                cor.nome;

            bloco.dataset.imagemAtual =
                cor.imagem || "";

if (cor.imagem) {

    const preview =
        document.createElement("img");

    preview.src =
        cor.imagem;

    preview.alt =
        `Foto atual ${cor.nome}`;

    preview.className =
        "foto-atual-cor";

    bloco
        .querySelector(".nova-cor-topo")
        .appendChild(preview);

}

            if (produto.estoque?.[cor.nome]) {

                Object.entries(produto.estoque[cor.nome])
                    .forEach(([tam, qtd]) => {

                        const input =
                            bloco.querySelector(
                                `[data-tamanho="${tam}"]`
                            );

                        if (input) {
                            input.value = qtd;
                        }

                    });

            }

        });

        // Muda botão
        const btn =
            document.getElementById("btnCadastrarProduto");
// -------------------------
// MOSTRA FOTOS EXTRAS ATUAIS
// -------------------------

const previewExtras =
    document.getElementById("previewFotosExtras");

previewExtras.innerHTML = "";


const imagensDasCores =
    new Set(
        (produto.cores || [])
            .map(cor => cor.imagem)
            .filter(Boolean)
    );


const fotosExtrasAtuais =
    (produto.imagens || [])
        .filter(
            imagem =>
                !imagensDasCores.has(imagem)
        );


fotosExtrasAtuais.forEach(imagem => {

    const item =
        document.createElement("div");

    item.className =
        "foto-extra-atual";

    item.dataset.imagem =
        imagem;


    item.innerHTML = `
        <img
            src="${imagem}"
            alt="Foto extra do produto"
        >

        <button
            type="button"
            class="remover-foto-extra"
        >
            Remover
        </button>
    `;


    item
        .querySelector(".remover-foto-extra")
        .addEventListener("click", () => {

            item.remove();

        });


    previewExtras.appendChild(item);

});
        btn.textContent =
            "Salvar alterações";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

    catch (erro) {

        alert(erro.message);

    }

}
        async function carregarEstoque() {

            const lista = document.getElementById("listaEstoque");

            try {

                const resposta = await fetch("/api/produtos");

                const produtos = await resposta.json();

                if (!resposta.ok) {
                    throw new Error("Erro ao carregar produtos");
                }

                lista.innerHTML = "";


                produtos.forEach(produto => {

                    const produtoDiv =
                        document.createElement("div");

                    produtoDiv.className =
                        "produto-admin";


                    const preco =
                        Number(produto.preco) / 100;


                    produtoDiv.innerHTML = `
    <h2>${produto.nome}</h2>

    <div class="produto-preco">
        R$ ${preco.toFixed(2).replace(".", ",")}
    </div>

    <div class="acoes-produto-admin">

    <button
        type="button"
        class="editar-produto"
        data-produto-id="${produto.id}"
    >
        Editar produto
    </button>

    <button
        type="button"
        class="alterar-status-produto"
        data-produto-id="${produto.id}"
        data-ativo="${produto.ativo}"
    >
        ${produto.ativo ? "Desativar" : "Ativar"}
    </button>

</div>

    <div class="cores-container"></div>
`;
produtoDiv
    .querySelector(".editar-produto")
    .addEventListener("click", () => {
        editarProduto(produto.id);
    });
    produtoDiv
    .querySelector(".alterar-status-produto")
    .addEventListener("click", () => {
        alterarStatusProduto(
            produto.id,
            produto.ativo
        );
    });

                    const coresContainer =
                        produtoDiv.querySelector(
                            ".cores-container"
                        );


                    const estoque =
                        produto.estoque || {};


                    Object.entries(estoque)
                        .forEach(([cor, tamanhos]) => {

                            const corDiv =
                                document.createElement("div");

                            corDiv.className =
                                "cor-admin";


                            corDiv.innerHTML = `
                                <h3>${cor}</h3>

                                <div class="estoque-grid"></div>
                            `;


                            const estoqueGrid =
                                corDiv.querySelector(
                                    ".estoque-grid"
                                );


                            Object.entries(tamanhos)
                                .forEach(
                                    ([tamanho, quantidade]) => {

                                        const item =
                                            document.createElement("div");

                                        item.className =
                                            "estoque-item";


                                        if (
                                            Number(quantidade) === 0
                                        ) {
                                            item.classList.add(
                                                "sem-estoque"
                                            );
                                        }


                                        item.innerHTML = `
    <strong>${tamanho}</strong>

    <div class="estoque-controle">

        <button
            type="button"
            class="diminuir-estoque"
        >
            −
        </button>

        <input
            type="number"
            min="0"
            class="estoque-input"
            value="${quantidade}"
            data-produto="${produto.id}"
            data-cor="${cor}"
            data-tamanho="${tamanho}"
        >

        <button
            type="button"
            class="aumentar-estoque"
        >
            +
        </button>

    </div>
`;

const input =
    item.querySelector(".estoque-input");

item
    .querySelector(".diminuir-estoque")
    .addEventListener("click", () => {

        const atual =
            Number(input.value) || 0;

        input.value =
            Math.max(0, atual - 1);

    });

item
    .querySelector(".aumentar-estoque")
    .addEventListener("click", () => {

        const atual =
            Number(input.value) || 0;

        input.value =
            atual + 1;

    });

                                        estoqueGrid.appendChild(
                                            item
                                        );

                                    }
                                );


                            coresContainer.appendChild(
                                corDiv
                            );

                        });


                    lista.appendChild(produtoDiv);

                });


                if (produtos.length === 0) {

                    lista.innerHTML =
                        "Nenhum produto cadastrado.";

                }

            }

            catch (erro) {

                console.error(erro);

                lista.innerHTML = `
                    <div class="erro">
                        Não foi possível carregar o estoque.
                    </div>
                `;

            }

        }

async function salvarEstoque() {

    let senha =
        sessionStorage.getItem("adminPassword");

    if (!senha) {

        senha = prompt(
            "Digite a senha do administrador:"
        );

        if (!senha) {
            return;
        }

    }


    const botao =
        document.getElementById(
            "btnSalvarEstoque"
        );

    const mensagem =
        document.getElementById(
            "mensagemAdmin"
        );


    botao.disabled = true;
    botao.textContent =
        "Salvando...";

    mensagem.className =
        "mensagem-admin";


    try {

        const campos =
            document.querySelectorAll(
                ".estoque-input"
            );


        for (const campo of campos) {

            const quantidade =
                Number(campo.value);


            if (
                !Number.isInteger(quantidade) ||
                quantidade < 0
            ) {
                throw new Error(
                    "Existe uma quantidade inválida."
                );
            }


            const resposta =
                await fetch(
                    "/api/atualizar-estoque",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "x-admin-password":
                                senha

                        },

                        body:
                            JSON.stringify({

                                produto_id:
                                    campo.dataset.produto,

                                cor:
                                    campo.dataset.cor,

                                tamanho:
                                    campo.dataset.tamanho,

                                quantidade:
                                    quantidade

                            })

                    }
                );


            if (resposta.status === 401) {

                sessionStorage.removeItem(
                    "adminPassword"
                );

                throw new Error(
                    "Senha incorreta."
                );

            }


            if (!resposta.ok) {

                const dados =
                    await resposta.json();

                throw new Error(
                    dados.erro ||
                    "Erro ao atualizar estoque."
                );

            }

        }


        sessionStorage.setItem(
            "adminPassword",
            senha
        );


        mensagem.textContent =
            "Estoque atualizado com sucesso.";

        mensagem.className =
            "mensagem-admin sucesso";


    }

    catch (erro) {

        console.error(erro);

        mensagem.textContent =
            erro.message;

        mensagem.className =
            "mensagem-admin erro";

    }

    finally {

        botao.disabled = false;

        botao.textContent =
            "Salvar estoque";

    }

}
async function cadastrarProduto() {

    const nome =
        document.getElementById("novoProdutoNome").value.trim();

    const preco =
        document.getElementById("novoProdutoPreco").value;

    const categoria =
        document.getElementById("novoProdutoCategoria").value;

    const descricao =
        document.getElementById("novoProdutoDescricao").value.trim();

    const mensagem =
        document.getElementById("mensagemProduto");

    const botao =
        document.getElementById("btnCadastrarProduto");


    if (!nome || !preco) {

        mensagem.textContent =
            "Preencha o nome e o preço.";

        mensagem.className =
            "mensagem-admin erro";

        return;
    }


    let senha =
        sessionStorage.getItem("adminPassword");


    if (!senha) {

        senha = prompt(
            "Digite a senha do administrador:"
        );

        if (!senha) {
            return;
        }

    }


    botao.disabled = true;
    botao.textContent = "Cadastrando...";

    mensagem.className =
        "mensagem-admin";

    try {

        // -------------------------
        // ID DO PRODUTO
        // -------------------------

       const produtoIdUpload =
    produtoEditando ||
    nome
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");


        // -------------------------
        // CORES + ESTOQUE + FOTO
        // -------------------------

        const blocosCores =
            document.querySelectorAll(".nova-cor");

        const cores = [];


        for (const bloco of blocosCores) {

            const nomeCor =
                bloco
                    .querySelector(".nome-nova-cor")
                    .value
                    .trim();


            if (!nomeCor) {

                throw new Error(
                    "Preencha o nome de todas as cores."
                );

            }


            // ESTOQUE

            const tamanhos = {};


            bloco
                .querySelectorAll(".estoque-novo-produto")
                .forEach(input => {

                    const quantidade =
                        Number(input.value);


                    if (
                        !Number.isInteger(quantidade) ||
                        quantidade < 0
                    ) {

                        throw new Error(
                            `Estoque inválido na cor ${nomeCor}.`
                        );

                    }


                    tamanhos[input.dataset.tamanho] =
                        quantidade;

                });


            // FOTO PRINCIPAL DA COR

            const arquivoFoto =
                bloco.querySelector(".foto-nova-cor")?.files[0];

            let urlImagem =
    bloco.dataset.imagemAtual || "";


            if (arquivoFoto) {

                mensagem.textContent =
                    `Enviando foto da cor ${nomeCor}...`;


                const fotoBase64 =
                    await new Promise(
                        (resolve, reject) => {

                            const leitor =
                                new FileReader();

                            leitor.onload = () =>
                                resolve(leitor.result);

                            leitor.onerror = () =>
                                reject(
                                    new Error(
                                        `Erro ao ler a foto da cor ${nomeCor}.`
                                    )
                                );

                            leitor.readAsDataURL(
                                arquivoFoto
                            );

                        }
                    );


                const respostaUpload =
                    await fetch(
                        "/api/upload-produto",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "x-admin-password":
                                    senha
                            },

                            body: JSON.stringify({

                                produtoId:
                                    produtoIdUpload,

                                cor:
                                    nomeCor,

                                arquivo:
                                    fotoBase64,

                                tipo:
                                    arquivoFoto.type

                            })

                        }
                    );


                const dadosUpload =
                    await respostaUpload.json();


                if (!respostaUpload.ok) {

                    if (
                        respostaUpload.status === 401
                    ) {

                        sessionStorage.removeItem(
                            "adminPassword"
                        );

                    }


                    throw new Error(
                        dadosUpload.erro ||
                        `Erro ao enviar a foto da cor ${nomeCor}.`
                    );

                }


                urlImagem =
                    dadosUpload.url;

            }


            cores.push({
                nome: nomeCor,
                imagem: urlImagem,
                estoque: tamanhos
            });

        }


        // -------------------------
        // FOTOS EXTRAS DA GALERIA
        // -------------------------

        const arquivosExtras =
            document.getElementById(
                "fotosExtrasProduto"
            )?.files;

        const imagensExtras =
    produtoEditando
        ? Array.from(
            document.querySelectorAll(
                "#previewFotosExtras .foto-extra-atual"
            )
        ).map(item => item.dataset.imagem)
        : [];


        if (arquivosExtras?.length) {

            let numeroFoto = 1;


            for (const arquivo of arquivosExtras) {

                mensagem.textContent =
                    `Enviando foto extra ${numeroFoto} de ${arquivosExtras.length}...`;


                const fotoBase64 =
                    await new Promise(
                        (resolve, reject) => {

                            const leitor =
                                new FileReader();

                            leitor.onload = () =>
                                resolve(leitor.result);

                            leitor.onerror = () =>
                                reject(
                                    new Error(
                                        "Erro ao ler uma das fotos extras."
                                    )
                                );

                            leitor.readAsDataURL(
                                arquivo
                            );

                        }
                    );


                const respostaUpload =
                    await fetch(
                        "/api/upload-produto",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "x-admin-password":
                                    senha
                            },

                            body: JSON.stringify({

                                produtoId:
                                    produtoIdUpload,

                                cor:
                                    `galeria-${numeroFoto}`,

                                arquivo:
                                    fotoBase64,

                                tipo:
                                    arquivo.type

                            })

                        }
                    );


                const dadosUpload =
                    await respostaUpload.json();


                if (!respostaUpload.ok) {

                    if (
                        respostaUpload.status === 401
                    ) {

                        sessionStorage.removeItem(
                            "adminPassword"
                        );

                    }


                    throw new Error(
                        dadosUpload.erro ||
                        `Erro ao enviar a foto extra ${numeroFoto}.`
                    );

                }


                imagensExtras.push(
                    dadosUpload.url
                );


                numeroFoto++;

            }

        }


        // -------------------------
        // CRIA PRODUTO
        // -------------------------

        mensagem.textContent =
            "Salvando produto...";


        const urlSalvar =
    produtoEditando
        ? "/api/editar-produto"
        : "/api/criar-produto";

const metodoSalvar =
    produtoEditando
        ? "PATCH"
        : "POST";


const resposta =
    await fetch(
        urlSalvar,
        {
            method: metodoSalvar,

            headers: {
                "Content-Type":
                    "application/json",

                "x-admin-password":
                    senha
            },

            body: JSON.stringify({
                id: produtoEditando,
                nome,
                preco,
                categoria,
                descricao,
                cores,
                imagensExtras
            })
        }
    );

        const dados =
            await resposta.json();


        if (resposta.status === 401) {

            sessionStorage.removeItem(
                "adminPassword"
            );

            throw new Error(
                "Senha incorreta."
            );

        }


        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                "Erro ao cadastrar produto."
            );

        }


        // -------------------------
        // SUCESSO
        // -------------------------

        sessionStorage.setItem(
            "adminPassword",
            senha
        );


        mensagem.textContent =
    produtoEditando
        ? `Produto "${dados.produto.nome}" atualizado com sucesso.`
        : `Produto "${dados.produto.nome}" cadastrado com sucesso.`;
        produtoEditando = null;
dadosProdutoEditando = null;

        mensagem.className =
            "mensagem-admin sucesso";


        document.getElementById(
            "novoProdutoNome"
        ).value = "";

        document.getElementById(
            "novoProdutoPreco"
        ).value = "";

        document.getElementById(
            "novoProdutoDescricao"
        ).value = "";
        document.getElementById(
    "novasCores"
).innerHTML = "";

document.getElementById(
    "fotosExtrasProduto"
).value = "";

adicionarCorProduto();


        await carregarEstoque();

    }

    catch (erro) {

        console.error(erro);

        mensagem.textContent =
            erro.message;

        mensagem.className =
            "mensagem-admin erro";

    }

    finally {

        botao.disabled = false;

        botao.textContent =
            "Cadastrar produto";

    }

}
function adicionarCorProduto() {

    const container =
        document.getElementById("novasCores");

    const cor =
        document.createElement("div");

    cor.className = "nova-cor";

    cor.innerHTML = `
        <div class="nova-cor-topo">

            <input
                type="text"
                class="nome-nova-cor"
                placeholder="Nome da cor. Ex: Preta"
            >
<input
            type="file"
            class="foto-nova-cor"
            accept="image/jpeg,image/png,image/webp"
        >

            <button
                type="button"
                class="remover-cor"
                onclick="this.closest('.nova-cor').remove()"
            >
                Remover
            </button>

        </div>

        <div class="tamanhos-nova-cor">

            ${["PP", "P", "M", "G", "GG"].map(tamanho => `

                <label class="tamanho-novo-produto">

                    <strong>${tamanho}</strong>

                    <input
                        type="number"
                        class="estoque-novo-produto"
                        data-tamanho="${tamanho}"
                        value="0"
                        min="0"
                        step="1"
                    >

                </label>

            `).join("")}

        </div>
    `;

    container.appendChild(cor);
}
       document.addEventListener("DOMContentLoaded", () => {
    adicionarCorProduto();
    carregarEstoque();
});

    </script>
