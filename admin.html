<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | PêlaModa</title>

    <style>
        * {
            box-sizing: border-box;
        }
body {
    margin: 0;
    font-family: "Segoe UI", Inter, Arial, sans-serif;
    background: #f3e7d3;
    color: #111;
}

button,
input,
select,
textarea {
    font-family: inherit;
}
    

        .admin {
            width: min(1100px, calc(100% - 30px));
            margin: 40px auto;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 5px;
        }

        .produto-admin {
            background: #fff;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .produto-admin h2 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .produto-preco {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .cor-admin {
            margin-top: 20px;
        }

        .cor-admin h3 {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .estoque-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .estoque-item {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            background: #fafafa;
        }

        .estoque-item strong {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .estoque-item span {
            font-size: 20px;
            font-weight: bold;
        }

        .sem-estoque {
            opacity: .45;
        }

        .erro {
            background: #ffdede;
            padding: 15px;
            border-radius: 6px;
        }
        .estoque-controle {
    display: flex;
    align-items: center;
    gap: 6px;
}

.estoque-controle button {
    width: 32px;
    height: 32px;
    border: 0;
    background: #111;
    color: #fff;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
}

.estoque-input {
    width: 55px;
    height: 32px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
}

.salvar-estoque {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: 0;
    border-radius: 7px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.salvar-estoque:disabled {
    opacity: .5;
    cursor: wait;
}

.mensagem-admin {
    margin-top: 15px;
    padding: 12px;
    border-radius: 6px;
    display: none;
}

.mensagem-admin.sucesso {
    display: block;
    background: #dff5e3;
}

.mensagem-admin.erro {
    display: block;
    background: #ffdede;
}
.novo-produto {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 40px;
}

.novo-produto h1 {
    margin-top: 0;
    margin-bottom: 5px;
}

.form-produto {
    display: grid;
    gap: 15px;
    margin-top: 25px;
}

.form-produto label {
    display: grid;
    gap: 6px;
    font-weight: bold;
}

.form-produto input,
.form-produto select,
.form-produto textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font: inherit;
}

.form-produto textarea {
    resize: vertical;
}

.cadastrar-produto {
    padding: 14px;
    border: 0;
    border-radius: 7px;
    background: #111;
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.cadastrar-produto:disabled {
    opacity: .5;
    cursor: wait;
}
.cores-novo-produto {
    margin-top: 10px;
}

.nova-cor {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-top: 12px;
    background: #fafafa;
}

.nova-cor-topo {
    display: flex;
    gap: 10px;
    align-items: center;
}

.nova-cor-topo input {
    flex: 1;
}

.remover-cor {
    border: 0;
    background: #eee;
    border-radius: 5px;
    padding: 10px 12px;
    cursor: pointer;
}

.tamanhos-nova-cor {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 15px;
}

.tamanho-novo-produto {
    display: grid;
    gap: 5px;
    text-align: center;
    font-size: 12px;
}

.tamanho-novo-produto input {
    text-align: center;
}

.adicionar-cor {
    margin-top: 12px;
    border: 1px solid #111;
    background: transparent;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
}
.foto-nova-cor {
    flex: 1;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
}
.fotos-extras-produto {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

.fotos-extras-produto > strong {
    display: block;
    margin-bottom: 5px;
}

.ajuda-admin {
    margin: 0 0 12px;
    font-size: 13px;
    color: #666;
}

#fotosExtrasProduto {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
}
.editar-produto {
    margin-top: 12px;
    border: 1px solid #111;
    background: #fff;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.editar-produto:hover {
    background: #111;
    color: #fff;
}
#previewFotosExtras {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 15px;
}

.foto-extra-atual {
    width: 100px;
    display: grid;
    gap: 6px;
}

.foto-extra-atual img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 7px;
    border: 1px solid #ddd;
}

.remover-foto-extra {
    border: 0;
    border-radius: 5px;
    padding: 7px;
    cursor: pointer;
    background: #eee;
}

.remover-foto-extra:hover {
    background: #ddd;
}
.admin-cupons {
    margin: 30px 0;
    padding: 24px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.admin-cupons h2 {
    margin-top: 0;
    margin-bottom: 20px;
}

.form-cupom {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(180px, 1fr));
    gap: 16px;
    align-items: end;
}

.form-cupom label {
    display: grid;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
}

.form-cupom input,
.form-cupom select {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
}

.cupom-ativo {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    gap: 8px !important;
    height: 42px;
}

.cupom-ativo input {
    width: auto;
}

#btnSalvarCupom {
    height: 42px;
    border: 0;
    border-radius: 6px;
    padding: 0 18px;
    background: #111;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
}

#btnSalvarCupom:hover {
    opacity: 0.85;
}

#mensagemCupom {
    grid-column: 1 / -1;
    margin: 0;
    font-size: 14px;
}

#listaCupons {
    display: grid;
    gap: 10px;
    margin-top: 24px;
}

.cupom-admin {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
}

.cupom-admin strong {
    min-width: 150px;
}

.cupom-admin span {
    min-width: 80px;
}

.cupom-admin button {
    border: 1px solid #bbb;
    background: #fff;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
}

.cupom-admin button:hover {
    background: #eee;
}

@media (max-width: 800px) {

    .form-cupom {
        grid-template-columns: 1fr;
    }

    .cupom-admin {

        flex-wrap: wrap;
    }

    .cupom-admin strong,

    }
}
@media (max-width: 700px) {
    .nova-cor-topo {

        align-items: stretch;

}
.foto-atual-cor {

    border-radius: 6px;
    border: 1px solid #ddd;
}
.acoes-produto-admin {

    margin-top: 12px;

.alterar-status-produto {

    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.alterar-status-produto:hover {
    background: #ddd;
}


@media (max-width: 600px) {
    .tamanhos-nova-cor {
        grid-template-columns: repeat(3, 1fr);
    }
}

}

    <script>
async function carregarCupons() {

    const lista =
        document.getElementById("listaCupons");

    if (!lista) return;

   const senha =
    sessionStorage.getItem("senhaAdmin") ||
    prompt("Digite a senha do administrador:");

if (!senha) return;

sessionStorage.setItem(
    "senhaAdmin",
    senha
);

    try {

        const resposta =
            await fetch(
                "/api/validar-cupom",
                {
                    method: "GET",
                    headers: {
                        "x-admin-password":
                            senha
                    }
                }
            );

        const cupons =
            await resposta.json();

        if (!resposta.ok) {
            throw new Error(
                cupons.erro ||
                "Erro ao carregar cupons."
            );
        }

        lista.innerHTML = "";

        cupons.forEach(cupom => {

            const item =
                document.createElement("div");

            item.className =
                "cupom-admin";

            const desconto =
                cupom.tipo === "percentual"
                    ? `${cupom.valor}%`
                    : `R$ ${Number(cupom.valor)
                        .toFixed(2)
                        .replace(".", ",")}`;

           item.innerHTML = `
    <strong>${cupom.codigo}</strong>

    <span>
        ${desconto}
    </span>

    <span>
        ${cupom.ativo
            ? "Ativo"
            : "Desativado"}
    </span>

    <button
        type="button"
        class="editar-cupom"
    >
        Editar
    </button>

    <button
        type="button"
        class="status-cupom"
    >
        ${cupom.ativo
            ? "Desativar"
            : "Ativar"}
    </button>
`;
item
    .querySelector(".editar-cupom")
    .addEventListener("click", () => {

        document.getElementById("cupomCodigo")
            .value =
            cupom.codigo;

        document.getElementById("cupomTipo")
            .value =
            cupom.tipo;

        document.getElementById("cupomValor")
            .value =
            cupom.valor;

        document.getElementById("cupomMinimo")
            .value =
            cupom.valor_minimo || 0;

        document.getElementById("cupomValidade")
            .value =
            cupom.valido_ate
                ? cupom.valido_ate.split("T")[0]
                : "";

        document.getElementById("cupomAtivo")
            .checked =
            cupom.ativo;

        document.getElementById("cupomCodigo")
            .scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
    });
item
    .querySelector(".status-cupom")
    .addEventListener("click", async () => {

        const senha =
            sessionStorage.getItem("senhaAdmin");

        if (!senha) return;

        const novoStatus =
            !cupom.ativo;

        const confirmar =
            confirm(
                novoStatus
                    ? `Ativar o cupom ${cupom.codigo}?`
                    : `Desativar o cupom ${cupom.codigo}?`
            );

        if (!confirmar) return;

        try {

            const resposta =
                await fetch(
                    "/api/validar-cupom",
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "x-admin-password":
                                senha
                        },

                        body: JSON.stringify({
                            acao:
                                "salvar-cupom",

                            codigo:
                                cupom.codigo,

                            tipo:
                                cupom.tipo,

                            valor:
                                cupom.valor,

                            valor_minimo:
                                cupom.valor_minimo || 0,

                            valido_ate:
                                cupom.valido_ate || null,

                            ativo:
                                novoStatus

async function salvarEstoque() {

    let senha =
        sessionStorage.getItem("adminPassword");

    if (!senha) {

        senha = prompt(
            "Digite a senha do administrador:"
        );

        if (!senha) {
            return;
        }

    }


    const botao =
        document.getElementById(
            "btnSalvarEstoque"
        );

    const mensagem =
        document.getElementById(
            "mensagemAdmin"
        );


    botao.disabled = true;
    botao.textContent =
        "Salvando...";

    mensagem.className =
        "mensagem-admin";


    try {

        const campos =
            document.querySelectorAll(
                ".estoque-input"
            );


        for (const campo of campos) {

            const quantidade =
                Number(campo.value);


            if (
                !Number.isInteger(quantidade) ||
                quantidade < 0
            ) {
                throw new Error(
                    "Existe uma quantidade inválida."
                );
            }


            const resposta =
                await fetch(
                    "/api/atualizar-estoque",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "x-admin-password":
                                senha

                        },

                        body:
                            JSON.stringify({

                                produto_id:
                                    campo.dataset.produto,

                                cor:
                                    campo.dataset.cor,

                                tamanho:
                                    campo.dataset.tamanho,

                                quantidade:
                                    quantidade

                            })

                    }
                );


            if (resposta.status === 401) {

                sessionStorage.removeItem(
                    "adminPassword"
                );

                throw new Error(
                    "Senha incorreta."
                );

            }


            if (!resposta.ok) {

                const dados =
                    await resposta.json();

                throw new Error(
                    dados.erro ||
                    "Erro ao atualizar estoque."
                );

            }

        }


        sessionStorage.setItem(
            "adminPassword",
            senha
        );


        mensagem.textContent =
            "Estoque atualizado com sucesso.";

        mensagem.className =
            "mensagem-admin sucesso";


    }

    catch (erro) {

        console.error(erro);

        mensagem.textContent =
            erro.message;

        mensagem.className =
            "mensagem-admin erro";

    }

    finally {

        botao.disabled = false;

        botao.textContent =
            "Salvar estoque";

    }

}
async function salvarCupom() {

            .toUpperCase();

            .value;

                .value
        );

        Number(

                .value || 0
        );

}function selecionarProdutosVisiveis() {

                const checkbox =
                    card.querySelector(
                        ".selecionar-produto-preco"
                    );

                if (checkbox) {
                    checkbox.checked = true;
                }
            }
        });
}


function desmarcarProdutos() {

        )

        });
}


async function aplicarPrecosEmMassa() {

    const selecionados =
        Array.from(
            document.querySelectorAll(
                ".selecionar-produto-preco:checked"
            )
        ).map(
            checkbox =>
                checkbox.dataset.produtoId
        );

    const precoNormal =
        document
            .getElementById("precoNormalLote")
            .value
            .trim();

    const precoPromocional =
        document
            .getElementById("precoPromocionalLote")
            .value
            .trim();

    const removerPromocao =
        document
            .getElementById("removerPromocaoLote")
            .checked;

    const mensagem =
        document.getElementById(
            "mensagemPrecosLote"
        );


    if (selecionados.length === 0) {
        mensagem.textContent =
            "Selecione pelo menos um produto.";
        return;
    }


    const alterarPrecoNormal =
        precoNormal !== "";

    const alterarPrecoPromocional =
        removerPromocao ||
        precoPromocional !== "";


    if (
        !alterarPrecoNormal &&
        !alterarPrecoPromocional
    ) {
        mensagem.textContent =
            "Informe algum preço para alterar.";
        return;
    }


    const senha =
        sessionStorage.getItem(
            "adminPassword"
        ) ||
        prompt(
            "Digite a senha do administrador:"
        );

    if (!senha) return;


    mensagem.textContent =
        "Atualizando preços...";


    try {

        const resposta =
            await fetch(
                "/api/editar-produto",
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "x-admin-password":
                            senha
                    },

                    body: JSON.stringify({

                        acao:
                            "alterar-precos-lote",

                        produtos:
                            selecionados,

                        alterar_preco_normal:
                            alterarPrecoNormal,

                        preco:
                            alterarPrecoNormal
                                ? precoNormal
                                : null,

                        alterar_preco_promocional:
                            alterarPrecoPromocional,

                        preco_promocional:
                            removerPromocao
                                ? null
                                : precoPromocional
                    })
                }
            );


        const dados =
            await resposta.json();


        if (!resposta.ok) {
            throw new Error(
                dados.erro ||
                "Erro ao atualizar preços."
            );
        }


        mensagem.textContent =
            `${selecionados.length} produto(s) atualizado(s) com sucesso.`;

        document.getElementById(
            "precoNormalLote"
        ).value = "";

        document.getElementById(
            "precoPromocionalLote"
        ).value = "";

        document.getElementById(
            "removerPromocaoLote"
        ).checked = false;


        await carregarEstoque();

    }

    catch (erro) {

        mensagem.textContent =
            erro.message;
    }
}

       document.addEventListener("DOMContentLoaded", async () => {
    adicionarCorProduto();
    carregarEstoque();
    await carregarCupons();

    const busca = document.getElementById("buscarProdutoAdmin");

    if (busca) {
        busca.addEventListener("input", () => {
            const termo = busca.value
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();

            document.querySelectorAll(".produto-admin")
                .forEach(card => {
                    const nome = (card.dataset.nome || "")
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "");

                    card.style.display =
                        nome.includes(termo) ? "block" : "none";
                });
        });
    }
});

    </script>
