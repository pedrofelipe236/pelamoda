<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | PêlaModa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3e7d3;
            color: #111;
        }

        .admin {
            width: min(1100px, calc(100% - 30px));
            margin: 40px auto;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 5px;
        }

        .produto-admin {
            background: #fff;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .produto-admin h2 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .produto-preco {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .cor-admin {
            margin-top: 20px;
        }

        .cor-admin h3 {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .estoque-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .estoque-item {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 6px;
            background: #fafafa;
        }

        .estoque-item strong {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .estoque-item span {
            font-size: 20px;
            font-weight: bold;
        }

        .sem-estoque {
            opacity: .45;
        }

        .erro {
            background: #ffdede;
            padding: 15px;
            border-radius: 6px;
        }
        .estoque-controle {
    display: flex;
    align-items: center;
    gap: 6px;
}

.estoque-controle button {
    width: 32px;
    height: 32px;
    border: 0;
    background: #111;
    color: #fff;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
}

.estoque-input {
    width: 55px;
    height: 32px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
}

.salvar-estoque {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: 0;
    border-radius: 7px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.salvar-estoque:disabled {
    opacity: .5;
    cursor: wait;
}

.mensagem-admin {
    margin-top: 15px;
    padding: 12px;
    border-radius: 6px;
    display: none;
}

.mensagem-admin.sucesso {
    display: block;
    background: #dff5e3;
}

.mensagem-admin.erro {
    display: block;
    background: #ffdede;
}
    </style>
</head>

<body>

    <main class="admin">

        <div class="admin-header">
            <h1>Estoque PêlaModa</h1>
            <p>Produtos, cores, tamanhos e quantidades.</p>
        </div>

        <div id="listaEstoque">
            Carregando estoque...
        </div>
<button
    id="btnSalvarEstoque"
    class="salvar-estoque"
    onclick="salvarEstoque()"
>
    Salvar estoque
</button>

<div
    id="mensagemAdmin"
    class="mensagem-admin"
></div>
    </main>


    <script>

        async function carregarEstoque() {

            const lista = document.getElementById("listaEstoque");

            try {

                const resposta = await fetch("/api/produtos");

                const produtos = await resposta.json();

                if (!resposta.ok) {
                    throw new Error("Erro ao carregar produtos");
                }

                lista.innerHTML = "";


                produtos.forEach(produto => {

                    const produtoDiv =
                        document.createElement("div");

                    produtoDiv.className =
                        "produto-admin";


                    const preco =
                        Number(produto.preco) / 100;


                    produtoDiv.innerHTML = `
                        <h2>${produto.nome}</h2>

                        <div class="produto-preco">
                            R$ ${preco.toFixed(2).replace(".", ",")}
                        </div>

                        <div class="cores-container"></div>
                    `;


                    const coresContainer =
                        produtoDiv.querySelector(
                            ".cores-container"
                        );


                    const estoque =
                        produto.estoque || {};


                    Object.entries(estoque)
                        .forEach(([cor, tamanhos]) => {

                            const corDiv =
                                document.createElement("div");

                            corDiv.className =
                                "cor-admin";


                            corDiv.innerHTML = `
                                <h3>${cor}</h3>

                                <div class="estoque-grid"></div>
                            `;


                            const estoqueGrid =
                                corDiv.querySelector(
                                    ".estoque-grid"
                                );


                            Object.entries(tamanhos)
                                .forEach(
                                    ([tamanho, quantidade]) => {

                                        const item =
                                            document.createElement("div");

                                        item.className =
                                            "estoque-item";


                                        if (
                                            Number(quantidade) === 0
                                        ) {
                                            item.classList.add(
                                                "sem-estoque"
                                            );
                                        }


                                        item.innerHTML = `
    <strong>${tamanho}</strong>

    <div class="estoque-controle">

        <button
            type="button"
            class="diminuir-estoque"
        >
            −
        </button>

        <input
            type="number"
            min="0"
            class="estoque-input"
            value="${quantidade}"
            data-produto="${produto.id}"
            data-cor="${cor}"
            data-tamanho="${tamanho}"
        >

        <button
            type="button"
            class="aumentar-estoque"
        >
            +
        </button>

    </div>
`;

const input =
    item.querySelector(".estoque-input");

item
    .querySelector(".diminuir-estoque")
    .addEventListener("click", () => {

        const atual =
            Number(input.value) || 0;

        input.value =
            Math.max(0, atual - 1);

    });

item
    .querySelector(".aumentar-estoque")
    .addEventListener("click", () => {

        const atual =
            Number(input.value) || 0;

        input.value =
            atual + 1;

    });

                                        estoqueGrid.appendChild(
                                            item
                                        );

                                    }
                                );


                            coresContainer.appendChild(
                                corDiv
                            );

                        });


                    lista.appendChild(produtoDiv);

                });


                if (produtos.length === 0) {

                    lista.innerHTML =
                        "Nenhum produto cadastrado.";

                }

            }

            catch (erro) {

                console.error(erro);

                lista.innerHTML = `
                    <div class="erro">
                        Não foi possível carregar o estoque.
                    </div>
                `;

            }

        }

async function salvarEstoque() {

    let senha =
        sessionStorage.getItem("adminPassword");

    if (!senha) {

        senha = prompt(
            "Digite a senha do administrador:"
        );

        if (!senha) {
            return;
        }

    }


    const botao =
        document.getElementById(
            "btnSalvarEstoque"
        );

    const mensagem =
        document.getElementById(
            "mensagemAdmin"
        );


    botao.disabled = true;
    botao.textContent =
        "Salvando...";

    mensagem.className =
        "mensagem-admin";


    try {

        const campos =
            document.querySelectorAll(
                ".estoque-input"
            );


        for (const campo of campos) {

            const quantidade =
                Number(campo.value);


            if (
                !Number.isInteger(quantidade) ||
                quantidade < 0
            ) {
                throw new Error(
                    "Existe uma quantidade inválida."
                );
            }


            const resposta =
                await fetch(
                    "/api/atualizar-estoque",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "x-admin-password":
                                senha

                        },

                        body:
                            JSON.stringify({

                                produto_id:
                                    campo.dataset.produto,

                                cor:
                                    campo.dataset.cor,

                                tamanho:
                                    campo.dataset.tamanho,

                                quantidade:
                                    quantidade

                            })

                    }
                );


            if (resposta.status === 401) {

                sessionStorage.removeItem(
                    "adminPassword"
                );

                throw new Error(
                    "Senha incorreta."
                );

            }


            if (!resposta.ok) {

                const dados =
                    await resposta.json();

                throw new Error(
                    dados.erro ||
                    "Erro ao atualizar estoque."
                );

            }

        }


        sessionStorage.setItem(
            "adminPassword",
            senha
        );


        mensagem.textContent =
            "Estoque atualizado com sucesso.";

        mensagem.className =
            "mensagem-admin sucesso";


    }

    catch (erro) {

        console.error(erro);

        mensagem.textContent =
            erro.message;

        mensagem.className =
            "mensagem-admin erro";

    }

    finally {

        botao.disabled = false;

        botao.textContent =
            "Salvar estoque";

    }

}
        document.addEventListener(
            "DOMContentLoaded",
            carregarEstoque
        );

    </script>

</body>

</html>
